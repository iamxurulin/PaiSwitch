name: Release Desktop

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag or release name, for example v1.0.0
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: paiswitch-web/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          java-package: jdk

      - name: Set up Maven
        shell: pwsh
        run: |
          $mavenPaths = @(
            "C:/M/tools/maven/current/bin",
            "C:/M/tools/maven/latest/bin",
            "C:/Program Files/Apache/maven/bin",
            "C:/tools/maven/bin"
          )
          $found = $false
          foreach ($p in $mavenPaths) {
            if (Test-Path "$p/mvn.cmd") {
              Write-Host "Found Maven at $p"
              Add-Content -Path $env:GITHUB_PATH -Value "$p"
              $found = $true
              break
            }
          }
          if (-not $found) {
            Write-Host "Maven not found at known paths, installing via chocolatey..."
            choco install maven -y --no-progress
          }
          mvn --version

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        working-directory: paiswitch-web
        run: npm ci

      - name: Build backend JAR and bundle runtime
        shell: bash
        run: |
          set -euo pipefail
          node paiswitch-web/scripts/build-desktop-backend.mjs

      - name: Build desktop app
        working-directory: paiswitch-web
        shell: bash
        run: |
          set -euo pipefail

          # On Windows, Tauri needs WebView2 runtime which is pre-installed on windows-latest
          BUILD_ARGS=(build --bundles nsis --ci)

          npm run tauri -- "${BUILD_ARGS[@]}"

      - name: Locate Windows bundles
        id: bundles
        shell: bash
        run: |
          set -euo pipefail
          # Debug: list the actual bundle directory structure
          if [ -d "src-tauri/target/release/bundle" ]; then
            echo "Bundle directory exists:"
            find src-tauri/target/release/bundle -type f -name '*.exe' 2>/dev/null || echo "No .exe files found"
          else
            echo "Bundle directory does not exist"
          fi
          # Try bash find first, then PowerShell as fallback
          NSIS_PATH="$(find src-tauri/target/release/bundle/nsis -maxdepth 1 -name '*-setup.exe' -print -quit 2>/dev/null || true)"
          if [ -z "$NSIS_PATH" ]; then
            # PowerShell fallback
            NSIS_PATH=$(pwsh -Command '
              $files = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1 -ExpandProperty FullName
              if ($files) { Write-Output $files }
            ' 2>/dev/null || true)
          fi
          if [ -z "$NSIS_PATH" ]; then
            echo "No .exe installer found" >&2
            exit 1
          fi
          echo "nsis=$NSIS_PATH" >> "$GITHUB_OUTPUT"
          echo "Found installer: $NSIS_PATH"

      - name: Package release assets
        id: assets
        working-directory: paiswitch-web
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${TAG#v}"
          ASSET_DIR="release-assets"
          NSIS_PATH="${{ steps.bundles.outputs.nsis }}"
          ASSET_NAME="PaiSwitch-${VERSION}-windows-x64.exe"

          rm -rf "$ASSET_DIR"
          mkdir -p "$ASSET_DIR"
          cp "$NSIS_PATH" "$ASSET_DIR/$ASSET_NAME"
          sha256sum "$ASSET_DIR"/* > "$ASSET_DIR/SHA256SUMS.txt"

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        working-directory: paiswitch-web
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --notes "Desktop release $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" release-assets/* --clobber

