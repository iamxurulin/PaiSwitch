name: Release Desktop

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag or release name, for example v1.0.0
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: paiswitch-web/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Verify Maven is available
        shell: bash
        run: |
          set -euo pipefail
          # windows-latest runner ships Maven but may not be on PATH
          MVN_PATH=$(where mvn 2>/dev/null || echo "")
          if [ -z "$MVN_PATH" ]; then
            # Fallback: install Apache Maven explicitly
            maven_version=3.9.6
            maven_url="https://archive.apache.org/dist/maven/maven-3/${maven_version}/binaries/apache-maven-${maven_version}-bin.zip"
            echo "Maven not on PATH, installing ${maven_version}..."
            curl -fsSL "$maven_url" -o /tmp/maven.zip
            mkdir -p /d/programs/maven
            tar -xzf /tmp/maven.zip -C /d/programs/maven --strip-components=1
            echo "/d/programs/maven/bin" >> "$GITHUB_PATH"
          fi
          mvn --version

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        working-directory: paiswitch-web
        run: npm ci

      - name: Build backend JAR and bundle runtime
        shell: bash
        run: |
          set -euo pipefail
          node paiswitch-web/scripts/build-desktop-backend.mjs

      - name: Build desktop app
        working-directory: paiswitch-web
        shell: bash
        run: |
          set -euo pipefail

          # On Windows, Tauri needs WebView2 runtime which is pre-installed on windows-latest
          BUILD_ARGS=(build --bundles nsis --ci)

          npm run tauri -- "${BUILD_ARGS[@]}"

      - name: Locate Windows bundles
        id: bundles
        shell: bash
        run: |
          set -euo pipefail
          NSIS_PATH="$(find src-tauri/target/release/bundle/nsis -maxdepth 1 -name '*Setup.exe' -print -quit)"
          if [ -z "$NSIS_PATH" ]; then
            echo "No .exe installer found" >&2
            exit 1
          fi
          echo "nsis=$NSIS_PATH" >> "$GITHUB_OUTPUT"

      - name: Package release assets
        id: assets
        working-directory: paiswitch-web
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${TAG#v}"
          ASSET_DIR="release-assets"
          NSIS_PATH="${{ steps.bundles.outputs.nsis }}"
          ASSET_NAME="PaiSwitch-${VERSION}-windows-x64.exe"

          rm -rf "$ASSET_DIR"
          mkdir -p "$ASSET_DIR"
          cp "$NSIS_PATH" "$ASSET_DIR/$ASSET_NAME"
          sha256sum "$ASSET_DIR"/* > "$ASSET_DIR/SHA256SUMS.txt"

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        working-directory: paiswitch-web
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --notes "Desktop release $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" release-assets/* --clobber

  macos:
    name: Build macOS installer
    runs-on: macos-14
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: paiswitch-web/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        working-directory: paiswitch-web
        run: npm ci

      - name: Prepare Apple notarization credentials
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${APPLE_API_KEY}${APPLE_API_ISSUER}${APPLE_API_PRIVATE_KEY}" ]; then
            echo "Apple notarization credentials not configured; release will not be notarized."
            exit 0
          fi

          if [ -z "${APPLE_CERTIFICATE}${APPLE_CERTIFICATE_PASSWORD}" ]; then
            echo "Apple notarization requires APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD." >&2
            exit 1
          fi

          if [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_PRIVATE_KEY" ]; then
            echo "APPLE_API_KEY_ID, APPLE_API_ISSUER and APPLE_API_PRIVATE_KEY must be configured together." >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/apple-notary"
          APPLE_API_KEY_PATH="$RUNNER_TEMP/apple-notary/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$APPLE_API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build desktop app
        working-directory: paiswitch-web
        shell: bash
        run: |
          set -euo pipefail

          npm run build:backend

          SIGNING_CONFIG="$RUNNER_TEMP/tauri-release-signing.json"
          export SIGNING_CONFIG
          node <<'NODE'
          const fs = require('node:fs')

          const macOS = {
            hardenedRuntime: true
          }

          if (process.env.APPLE_SIGNING_IDENTITY) {
            macOS.signingIdentity = process.env.APPLE_SIGNING_IDENTITY
          }

          if (process.env.APPLE_PROVIDER_SHORT_NAME) {
            macOS.providerShortName = process.env.APPLE_PROVIDER_SHORT_NAME
          }

          fs.writeFileSync(
            process.env.SIGNING_CONFIG,
            JSON.stringify({ bundle: { macOS } }, null, 2)
          )
          NODE

          BUILD_ARGS=(build --bundles app,dmg --ci --config "$SIGNING_CONFIG")

          if [ -z "${APPLE_CERTIFICATE}${APPLE_CERTIFICATE_PASSWORD}" ]; then
            echo "Apple signing certificate not configured; building unsigned artifacts."
            BUILD_ARGS+=(--no-sign)
          elif [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD must be configured together." >&2
            exit 1
          else
            echo "Apple signing certificate configured; building signed artifacts."
          fi

          npm run tauri -- "${BUILD_ARGS[@]}"

      - name: Verify desktop bundle
        working-directory: paiswitch-web
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          DMG_PATH="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found" >&2
            exit 1
          fi

          if [ -z "$DMG_PATH" ]; then
            echo "No .dmg installer found" >&2
            exit 1
          fi

          if [ -n "${APPLE_CERTIFICATE}${APPLE_CERTIFICATE_PASSWORD}" ]; then
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          fi

          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            xcrun stapler validate "$APP_PATH"
          fi

          hdiutil verify "$DMG_PATH"

      - name: Package release assets
        id: assets
        working-directory: paiswitch-web
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${TAG#v}"
          case "$(uname -m)" in
            arm64|aarch64) ASSET_ARCH="arm64" ;;
            x86_64) ASSET_ARCH="x64" ;;
            *) ASSET_ARCH="$(uname -m)" ;;
          esac
          ASSET_PREFIX="PaiSwitch-${VERSION}-macos-${ASSET_ARCH}"
          ASSET_DIR="release-assets"
          APP_PATH="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          DMG_PATH="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found" >&2
            exit 1
          fi

          if [ -z "$DMG_PATH" ]; then
            echo "No .dmg installer found" >&2
            exit 1
          fi

          rm -rf "$ASSET_DIR"
          mkdir -p "$ASSET_DIR"
          ditto -c -k --keepParent "$APP_PATH" "$ASSET_DIR/${ASSET_PREFIX}.app.zip"
          cp "$DMG_PATH" "$ASSET_DIR/${ASSET_PREFIX}.dmg"
          shasum -a 256 "$ASSET_DIR"/* > "$ASSET_DIR/SHA256SUMS.txt"

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        working-directory: paiswitch-web
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --notes "Desktop release $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
